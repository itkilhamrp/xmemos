name: Reusable — GNU/Linux AppImage & Flatpak Release

on:
  workflow_call:
    inputs:
      app_version:
        description: 'Resolved application SemVer'
        required: true
        type: string
      source_date_epoch:
        description: 'Pinned SOURCE_DATE_EPOCH timestamp'
        required: true
        type: string
      build_appimage:
        description: 'Build cross-distro AppImage (ubuntu:22.04 glibc 2.35)'
        required: true
        type: boolean
      build_flatpak:
        description: 'Build sandboxed Flatpak offline bundle (GNOME 51)'
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-appimage:
    name: AppImage (${{ matrix.arch }}, glibc 2.35)
    if: inputs.build_appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_INCREMENTAL: '0'
      XMEMOS_TARGET_PLATFORM: 'desktop'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_STRIP: 'true'
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      APP_VERSION: ${{ inputs.app_version }}
    steps:
      - name: Install Ubuntu 22.04 Tauri v2 & GStreamer build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config file xdg-utils \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf squashfs-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export deterministic Rust flags
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/home --remap-path-prefix=${PWD}=/workspace -C debuginfo=0" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust toolchain (pinned rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          prefix-key: 'linux-appimage-${{ matrix.arch }}'

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Desktop-adaptive frontend & GNU/Linux AppImage
        run: |
          pnpm build
          pnpm tauri build --bundles appimage

      - name: Stage deterministic AppImage artifact
        run: |
          mkdir -p dist-release
          APPIMG="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          if [ -z "${APPIMG}" ]; then
            echo "ERROR: No AppImage produced." >&2
            exit 1
          fi
          DEST="dist-release/Xmemos-v${APP_VERSION}-linux-${{ matrix.arch }}.AppImage"
          cp "${APPIMG}" "${DEST}"
          chmod +x "${DEST}"
          touch -d "@${SOURCE_DATE_EPOCH}" "${DEST}"
          ls -lh "${DEST}"

      - name: Upload GNU/Linux AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: xmemos-linux-appimage-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error

  build-flatpak:
    name: Flatpak Offline Bundle (${{ matrix.arch }}, GNOME 51)
    if: inputs.build_flatpak
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_INCREMENTAL: '0'
      XMEMOS_TARGET_PLATFORM: 'desktop'
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      APP_VERSION: ${{ inputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export deterministic Rust flags
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/home --remap-path-prefix=${PWD}=/workspace -C debuginfo=0" >> "$GITHUB_ENV"

      - name: Install Linux Tauri & Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak ca-certificates pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.flatpak.Builder \
            org.gnome.Platform//51 \
            org.gnome.Sdk//51

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust toolchain (pinned rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          prefix-key: 'linux-flatpak-${{ matrix.arch }}'

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Desktop-adaptive frontend & Debian staging package
        run: |
          pnpm build
          pnpm tauri build --bundles deb

      - name: Build sandboxed Flatpak & export single-file offline .flatpak bundle
        run: |
          mkdir -p dist-release
          DEB_FILE="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          if [ -z "${DEB_FILE}" ]; then
            echo "ERROR: No .deb staging package produced." >&2
            exit 1
          fi
          cp "${DEB_FILE}" packaging/flatpak/xmemos.deb
          cp src-tauri/icons/icon.png packaging/flatpak/org.xmemos.app.png
          cp src-tauri/icons/icon.svg packaging/flatpak/org.xmemos.app.svg

          flatpak run org.flatpak.Builder \
            --force-clean \
            --user \
            --disable-cache \
            --repo=flatpak-repo \
            flatpak-build \
            packaging/flatpak/org.xmemos.app.yaml

          BUNDLE_PATH="dist-release/Xmemos-v${APP_VERSION}-linux-${{ matrix.arch }}.flatpak"
          flatpak build-bundle \
            flatpak-repo \
            "${BUNDLE_PATH}" \
            org.xmemos.app \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

          touch -d "@${SOURCE_DATE_EPOCH}" "${BUNDLE_PATH}"
          ls -lh "${BUNDLE_PATH}"

      - name: Upload GNU/Linux Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: xmemos-linux-flatpak-${{ matrix.arch }}
          path: dist-release/*
          if-no-files-found: error
