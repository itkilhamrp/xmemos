name: Reusable — macOS DMG Release

on:
  workflow_call:
    inputs:
      app_version:
        description: 'Resolved application SemVer'
        required: true
        type: string
      source_date_epoch:
        description: 'Pinned SOURCE_DATE_EPOCH timestamp'
        required: true
        type: string
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS DMG (arm64 & x64)
    # Use a single macos-15-intel runner (4-core x86_64 pool, separate from the congested
    # macOS arm64 pool) to build both Apple Silicon (aarch64) and Intel (x86_64) DMGs reliably.
    runs-on: macos-15-intel
    env:
      CARGO_INCREMENTAL: '0'
      XMEMOS_TARGET_PLATFORM: 'desktop'
      SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      APP_VERSION: ${{ inputs.app_version }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export deterministic Rust flags
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/home --remap-path-prefix=${PWD}=/workspace -C debuginfo=0" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust toolchain & macOS targets (arm64 + x64)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          prefix-key: 'macos-dual'

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Desktop-adaptive frontend & macOS DMGs (arm64 & x64)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset empty Apple signing/notarization env vars so Tauri falls back cleanly to ad-hoc signing
          [ -n "${APPLE_CERTIFICATE:-}" ] || unset APPLE_CERTIFICATE
          [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] || unset APPLE_CERTIFICATE_PASSWORD
          [ -n "${APPLE_SIGNING_IDENTITY:-}" ] || unset APPLE_SIGNING_IDENTITY
          [ -n "${APPLE_ID:-}" ] || unset APPLE_ID
          [ -n "${APPLE_PASSWORD:-}" ] || unset APPLE_PASSWORD
          [ -n "${APPLE_TEAM_ID:-}" ] || unset APPLE_TEAM_ID

          pnpm build
          # Build signed .app bundles directly (bypassing Tauri's vendored bundle_dmg.sh which hits
          # hdiutil exit-2 'Resource busy' on macOS 15 GitHub runners — see tauri-apps/tauri#14686)
          pnpm tauri build --target aarch64-apple-darwin --bundles app
          pnpm tauri build --target x86_64-apple-darwin --bundles app

      - name: Package & stage macOS DMG artifacts (arm64 & x64, mount-free UDZO)
        run: |
          set -euo pipefail
          mkdir -p dist-release

          package_dmg() {
            local arch_label="$1"
            local target_triple="$2"
            local app_path="src-tauri/target/${target_triple}/release/bundle/macos/Xmemos.app"
            local out_dmg="dist-release/Xmemos-v${APP_VERSION}-macos-${arch_label}.dmg"
            local stage_dir="${RUNNER_TEMP}/dmg-stage-${arch_label}"

            if [ ! -d "${app_path}" ]; then
              echo "ERROR: Expected macOS app bundle not found: ${app_path}" >&2
              exit 1
            fi

            rm -rf "${stage_dir}" "${out_dmg}"
            mkdir -p "${stage_dir}"
            # ditto preserves 100% of macOS code signatures, symlinks, and bundle metadata
            ditto "${app_path}" "${stage_dir}/Xmemos.app"
            ln -s /Applications "${stage_dir}/Applications"

            # Direct read-only UDZO image creation never mounts an interstitial RW disk image,
            # completely eliminating Spotlight/Finder 'hdiutil: couldn't eject - Resource busy' failures.
            local attempt=1
            while true; do
              if hdiutil create -volname "Xmemos" -srcfolder "${stage_dir}" -ov -format UDZO "${out_dmg}"; then
                break
              fi
              if [ "${attempt}" -ge 3 ]; then
                echo "ERROR: hdiutil create failed after 3 attempts for ${arch_label}" >&2
                exit 1
              fi
              echo "WARN: hdiutil create attempt ${attempt} failed; retrying in 5s..." >&2
              sleep 5
              attempt=$((attempt + 1))
            done

            hdiutil verify "${out_dmg}"
            rm -rf "${stage_dir}"
          }

          package_dmg "arm64" "aarch64-apple-darwin"
          package_dmg "x64" "x86_64-apple-darwin"

          ls -lh dist-release/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmemos-macos
          path: dist-release/*
          if-no-files-found: error
