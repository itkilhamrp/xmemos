name: Multi-Platform Deterministic Release

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel'
        required: true
        type: choice
        default: stable
        options:
          - stable
          - prerelease
          - draft
      build_android:
        description: 'Build Android APKs (deterministic v2/v3 signed)'
        required: true
        type: boolean
        default: true
      target_abis:
        description: 'Android ABIs to build (when build_android is enabled)'
        required: true
        type: choice
        default: all
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal
      build_linux_appimage:
        description: 'Build GNU/Linux cross-distro AppImage (x86_64 & aarch64, glibc 2.35)'
        required: true
        type: boolean
        default: true
      build_linux_flatpak:
        description: 'Build GNU/Linux Flatpak offline bundle (x86_64 & aarch64, GNOME 51)'
        required: true
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows 10/11 Full Offline Installer (.exe) & Portable (.zip)'
        required: true
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS DMG bundles (Apple Silicon arm64 & Intel x64)'
        required: true
        type: boolean
        default: true
      publish_release:
        description: 'Publish GitHub Release with unified SHA-256 checksums, certs & SLSA provenance'
        required: true
        type: boolean
        default: true
      verify_reproducibility:
        description: 'Run a second clean Android build pass and assert 1:1 identical SHA-256'
        required: true
        type: boolean
        default: false
      apply_license_headers:
        description: 'Run google/addlicense header verification before build'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Pre-Flight Audit, Tests & Deterministic Metadata
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.meta.outputs.app_version }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout repository (full history for SOURCE_DATE_EPOCH)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve deterministic release metadata
        id: meta
        run: |
          EPOCH="$(git log -1 --format=%ct)"
          APP_VERSION="$(node -p "require('./package.json').version")"
          echo "source_date_epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Xmemos v${APP_VERSION} with SOURCE_DATE_EPOCH=${EPOCH}"

      - name: Install Linux GTK3/WebKitGTK headers for Rust Clippy & Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Setup Rust toolchain (pinned 1.100.0)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Go & google/addlicense
        if: inputs.apply_license_headers
        run: |
          go install github.com/google/addlicense@v1.1.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate version SSOT, FOSS purity & license headers
        run: |
          pnpm version:check
          pnpm foss:check
          if [ "${{ inputs.apply_license_headers }}" = "true" ]; then
            pnpm license:check
          fi

      - name: Supply-chain dependency audit (pnpm)
        run: pnpm audit --prod --audit-level=high || echo "::warning::High-severity advisory detected in production npm tree; inspect audit log."

      - name: Run frontend typecheck & unit tests
        run: |
          pnpm check
          pnpm test

      - name: Run Rust Clippy (-D warnings) & SQLite 1:1 compatibility tests
        working-directory: src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  android:
    name: Android
    needs: preflight
    if: inputs.build_android
    permissions:
      contents: write
    uses: ./.github/workflows/android-release.yml
    with:
      app_version: ${{ needs.preflight.outputs.app_version }}
      source_date_epoch: ${{ needs.preflight.outputs.source_date_epoch }}
      target_abis: ${{ inputs.target_abis }}
      verify_reproducibility: ${{ inputs.verify_reproducibility }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  linux:
    name: GNU/Linux
    needs: preflight
    if: inputs.build_linux_appimage || inputs.build_linux_flatpak
    uses: ./.github/workflows/linux-release.yml
    with:
      app_version: ${{ needs.preflight.outputs.app_version }}
      source_date_epoch: ${{ needs.preflight.outputs.source_date_epoch }}
      build_appimage: ${{ inputs.build_linux_appimage }}
      build_flatpak: ${{ inputs.build_linux_flatpak }}

  windows:
    name: Windows
    needs: preflight
    if: inputs.build_windows
    uses: ./.github/workflows/windows-release.yml
    with:
      app_version: ${{ needs.preflight.outputs.app_version }}
      source_date_epoch: ${{ needs.preflight.outputs.source_date_epoch }}

  macos:
    name: macOS
    needs: preflight
    if: inputs.build_macos
    uses: ./.github/workflows/macos-release.yml
    with:
      app_version: ${{ needs.preflight.outputs.app_version }}
      source_date_epoch: ${{ needs.preflight.outputs.source_date_epoch }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish-release:
    name: Unified Checksums, SLSA Provenance & GitHub Release
    needs: [preflight, android, linux, windows, macos]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      SOURCE_DATE_EPOCH: ${{ needs.preflight.outputs.source_date_epoch }}
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
    steps:
      - name: Checkout repository (for changelog generation)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all platform build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-release
          pattern: xmemos-*
          merge-multiple: true

      - name: Generate unified SHA-256 checksums across all platforms
        id: checksums
        run: |
          (
            cd dist-release
            find . -maxdepth 1 -type f \
              ! -name '*-SHA256SUMS.txt' \
              ! -name '*-SIGNING-CERT.txt' \
              -printf '%f\n' | LC_ALL=C sort | xargs -r sha256sum > "Xmemos-v${APP_VERSION}-SHA256SUMS.txt"
          )
          cat "dist-release/Xmemos-v${APP_VERSION}-SHA256SUMS.txt"
          {
            echo "subject_files<<EOF"
            find dist-release -maxdepth 1 -type f \
              ! -name '*-SHA256SUMS.txt' \
              ! -name '*-SIGNING-CERT.txt' | LC_ALL=C sort
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SLSA Build Provenance attestations (public repositories)
        if: github.event.repository.private == false && steps.checksums.outputs.subject_files != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.checksums.outputs.subject_files }}

      - name: Upload unified release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: xmemos-v${{ env.APP_VERSION }}-all-platforms
          path: dist-release/*

      - name: Publish GitHub Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          if [ -n "${PREV_TAG}" ]; then
            CHANGELOG="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)')"
          else
            CHANGELOG="$(git log -n 20 --pretty=format:'- %s (%h)')"
          fi

          CERT_SECTION=""
          if [ -f "dist-release/Xmemos-v${APP_VERSION}-SIGNING-CERT.txt" ]; then
            CERT_CONTENT="$(cat "dist-release/Xmemos-v${APP_VERSION}-SIGNING-CERT.txt")"
            CERT_SECTION=$(cat << CERT_EOF

          ### APK Signing Certificate Fingerprints
          \`\`\`text
          ${CERT_CONTENT}
          \`\`\`
          CERT_EOF
          )
          fi

          cat << BODY_EOF > release-notes.md
          ## Xmemos v${APP_VERSION}

          Privacy-first, 100% offline microblogging and knowledge-capture app with 1:1 Official FOSS Memos SQLite compatibility.

          ### Changelog
          ${CHANGELOG}

          ### Multi-Platform Offline Packages
          | Platform | Package | Notes |
          | :--- | :--- | :--- |
          | **Android** (API 24–36) | \`Xmemos-v${APP_VERSION}-android-*-release.apk\` | Deterministic v2/v3 signed APK, GMS-free, Android-adaptive build |
          | **GNU/Linux (AppImage)** | \`Xmemos-v${APP_VERSION}-linux-{x86_64,aarch64}.AppImage\` | Built on Ubuntu 22.04 (\`glibc 2.35\`), stripped & lean (\`bundleMediaFramework: false\`); run \`chmod +x\` & execute offline |
          | **GNU/Linux (Flatpak)** | \`Xmemos-v${APP_VERSION}-linux-{x86_64,aarch64}.flatpak\` | Sandboxed GNOME 51 offline bundle (\`flatpak install --user ...\`), Portal file dialogs |
          | **Windows 10/11 (Installer)** | \`Xmemos-v${APP_VERSION}-windows-x64-setup.exe\` | 100% offline lean NSIS LZMA installer (~5–6 MB, \`webviewInstallMode: skip\`, zero network calls; uses OS-preinstalled Windows 10/11 WebView2 Runtime) |
          | **Windows 10/11 (Portable)** | \`Xmemos-v${APP_VERSION}-windows-x64-portable.zip\` | Extract & run \`Xmemos.exe\`; self-contained \`./data/\` storage via \`portable.flag\` |
          | **macOS 12+** | \`Xmemos-v${APP_VERSION}-macos-{arm64,x64}.dmg\` | Native Apple Silicon (\`arm64\`) & Intel (\`x64\`) disk images |

          ### Build Metadata
          | Field | Value |
          | :--- | :--- |
          | App Version | \`v${APP_VERSION}\` |
          | Git Commit | \`${GITHUB_SHA}\` |
          | SOURCE_DATE_EPOCH | \`${SOURCE_DATE_EPOCH}\` |
          | Adaptive Build Targets | \`android\` (APK) / \`desktop\` (GNU/Linux, Windows, macOS) |
          | Reproducible Builds | \`true\` (deterministic timestamps, remapped Rust paths, v2/v3 APK sig) |
          | Supply Chain Security | SLSA Build Provenance (\`actions/attest-build-provenance@v4\`), explicit secret isolation |
          | License | \`AGPL-3.0-or-later\` |

          ### SHA-256 Checksums
          \`\`\`text
          $(cat "dist-release/Xmemos-v${APP_VERSION}-SHA256SUMS.txt")
          \`\`\`
          ${CERT_SECTION}

          ### Verification Instructions
          \`\`\`bash
          # Verify SHA-256 integrity of any downloaded file
          sha256sum -c --ignore-missing Xmemos-v${APP_VERSION}-SHA256SUMS.txt

          # Verify Android APK signature (if downloaded)
          apksigner verify --verbose --print-certs Xmemos-v${APP_VERSION}-android-arm64-v8a-release.apk

          # Verify GitHub SLSA Build Provenance attestation (public repo)
          gh attestation verify Xmemos-v${APP_VERSION}-linux-x86_64.AppImage --repo ${GITHUB_REPOSITORY}
          \`\`\`
          BODY_EOF

          retry_gh() {
            local attempt=1
            local max_attempts=5
            local delay=5
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "ERROR: Command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "WARN: Attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s..." >&2
              sleep "${delay}"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          TAG="v${APP_VERSION}"

          # 1. Create (as draft) or update release metadata with explicit --target commit SHA
          if gh release view "${TAG}" >/dev/null 2>&1; then
            retry_gh gh release edit "${TAG}" \
              --title "Xmemos ${TAG}" \
              --notes-file release-notes.md
          else
            retry_gh gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "Xmemos ${TAG}" \
              --notes-file release-notes.md \
              --draft
          fi

          # 2. Upload each asset individually with --clobber and per-file exponential-backoff retries
          for asset in dist-release/*; do
            [ -f "${asset}" ] || continue
            echo "Uploading release asset: ${asset}"
            retry_gh gh release upload "${TAG}" "${asset}" --clobber
          done

          # 3. Publish the completed draft release (compatible with GitHub Immutable Releases)
          if [ "${{ inputs.release_channel }}" = "stable" ]; then
            retry_gh gh release edit "${TAG}" --draft=false --prerelease=false
          elif [ "${{ inputs.release_channel }}" = "prerelease" ]; then
            retry_gh gh release edit "${TAG}" --draft=false --prerelease=true
          fi
