[package]
name = "tauri-plugin-xmemos-storage"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Tauri v2 Android/Desktop storage, SAF picker, .nomedia, and BiometricPrompt bridge for Xmemos"
links = "tauri-plugin-xmemos-storage"

[dependencies]
tauri = { version = "2.12.7" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[build-dependencies]
tauri-plugin = { version = "2.6.0", features = ["build"] }
