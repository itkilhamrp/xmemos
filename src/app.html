<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<title>Xmemos</title>
		<script>
			(function () {
				try {
					var mode = localStorage.getItem('xmemos.theme') || 'system';
					var glass = localStorage.getItem('xmemos.glass') || 'liquid';
					var loc = localStorage.getItem('xmemos.locale');
					if (loc === 'en' || loc === 'id' || loc === 'es') document.documentElement.lang = loc;
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
					var root = document.documentElement;
					root.classList.toggle('dark', isDark);
					root.dataset.glass = glass;
					root.style.colorScheme = isDark ? 'dark' : 'light';
				} catch (e) {
					// Ignore storage access restrictions
				}
			})();
		</script>
		<style>
			html,
			body,
			.k-ios-page {
				margin: 0;
				background-color: #f2f2f7;
				color: #000000;
			}
			html.dark,
			html.dark body,
			html.dark .k-ios-page {
				background-color: #000000;
				color: #ffffff;
			}
			#xm-boot-shell {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: max(18px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
				background: #f2f2f7;
				pointer-events: none;
			}
			html.dark #xm-boot-shell { background: #000000; }
			.xm-boot-bar { height: 22px; width: 112px; border-radius: 10px; background: rgba(15, 23, 42, 0.08); }
			.xm-boot-pill { height: 56px; max-width: 440px; width: 100%; margin: 0 auto; border-radius: 9999px; background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(15, 23, 42, 0.08); }
			html.dark .xm-boot-bar { background: rgba(255, 255, 255, 0.1); }
			html.dark .xm-boot-pill { background: rgba(28, 28, 32, 0.9); border-color: rgba(255, 255, 255, 0.1); }
		</style>
		%sveltekit.head%
	</head>
	<body class="antialiased selection:bg-sky-500/30">
		<div id="xm-boot-shell" aria-hidden="true">
			<div class="xm-boot-bar"></div>
			<div class="xm-boot-pill"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
