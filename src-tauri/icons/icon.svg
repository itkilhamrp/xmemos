<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none" role="img" aria-label="Xmemos">
  <defs>
    <!-- 1. Base macOS 2026 Liquid Glass Oceanic Sapphire Substrate -->
    <linearGradient id="xm-bg-base" x1="110" y1="80" x2="914" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3AC0FF"/>
      <stop offset="30%" stop-color="#0A84FF"/>
      <stop offset="70%" stop-color="#0056D2"/>
      <stop offset="100%" stop-color="#06287A"/>
    </linearGradient>

    <!-- 2. Subsurface Liquid Glass Caustic Glows (Smooth Atmospheric Refraction) -->
    <radialGradient id="xm-caustic-top" cx="270" cy="185" r="590" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.62"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="xm-caustic-bottom" cx="775" cy="865" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.56"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06287A" stop-opacity="0"/>
    </radialGradient>

    <!-- 3. Soft Feathered Liquid Glass Surface Sheen (No Harsh Gloss Line) -->
    <radialGradient id="xm-glass-sheen" cx="512" cy="110" r="620" fx="440" fy="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.46"/>
      <stop offset="42%" stop-color="#E0F2FE" stop-opacity="0.14"/>
      <stop offset="76%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 4. Lower Fresnel Refractive Caustic Bounce -->
    <linearGradient id="xm-bottom-bounce" x1="512" y1="730" x2="512" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0"/>
      <stop offset="65%" stop-color="#BAE6FD" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.34"/>
    </linearGradient>

    <!-- 5. Dual Fresnel Luminous Glass Rim Bevel -->
    <linearGradient id="xm-rim-bevel" x1="120" y1="90" x2="904" y2="934" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="26%" stop-color="#E0F2FE" stop-opacity="0.40"/>
      <stop offset="58%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.68"/>
    </linearGradient>

    <!-- 6. Stacked Back Frosted-Glass Memo Sheet -->
    <linearGradient id="xm-back-sheet" x1="292" y1="202" x2="732" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.20"/>
    </linearGradient>

    <!-- 7. Primary Frosted Liquid Glass Memo Card -->
    <linearGradient id="xm-card-fill" x1="256" y1="238" x2="768" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.99"/>
      <stop offset="50%" stop-color="#F3F9FF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#DCEBFF" stop-opacity="0.92"/>
    </linearGradient>

    <linearGradient id="xm-card-rim" x1="256" y1="238" x2="768" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="52%" stop-color="#E0F2FE" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.78"/>
    </linearGradient>

    <!-- 8. Sculpted Frosted-Glass Corner Fold -->
    <linearGradient id="xm-fold-flap" x1="630" y1="238" x2="768" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="48%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- 9. Interlocking Precision Liquid Glass X Monogram -->
    <linearGradient id="xm-x-back" x1="634" y1="422" x2="390" y2="666" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="48%" stop-color="#005ED9"/>
      <stop offset="100%" stop-color="#08308A"/>
    </linearGradient>

    <linearGradient id="xm-x-front" x1="390" y1="422" x2="634" y2="666" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="44%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#004EC2"/>
    </linearGradient>

    <linearGradient id="xm-x-sheen" x1="396" y1="414" x2="628" y2="646" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="52%" stop-color="#E0F2FE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 10. Unclipped Cross-OS Standard SVG Filters (userSpaceOnUse prevents shadow cutoff) -->
    <filter id="xm-tile-shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#00163E" flood-opacity="0.32"/>
    </filter>

    <filter id="xm-card-shadow" filterUnits="userSpaceOnUse" x="140" y="140" width="744" height="780">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#001C54" flood-opacity="0.30"/>
    </filter>

    <filter id="xm-fold-shadow" filterUnits="userSpaceOnUse" x="580" y="200" width="240" height="240">
      <feDropShadow dx="-4" dy="8" stdDeviation="7" flood-color="#002D7A" flood-opacity="0.22"/>
    </filter>

    <filter id="xm-x-cross-shadow" filterUnits="userSpaceOnUse" x="300" y="340" width="424" height="424">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001B4F" flood-opacity="0.28"/>
    </filter>

    <clipPath id="xm-squircle-clip">
      <path d="M 512.00 80.00 C 754.78 80.00, 822.23 79.08, 883.57 140.43 C 944.92 201.77, 944.00 269.22, 944.00 512.00 C 944.00 754.78, 944.92 822.23, 883.57 883.57 C 822.23 944.92, 754.78 944.00, 512.00 944.00 C 269.22 944.00, 201.77 944.92, 140.43 883.57 C 79.08 822.23, 80.00 754.78, 80.00 512.00 C 80.00 269.22, 79.08 201.77, 140.43 140.43 C 201.77 79.08, 269.22 80.00, 512.00 80.00 Z"/>
    </clipPath>
  </defs>

  <!-- Layer 1: macOS 2026 Continuous Squircle Liquid Glass Tile -->
  <g filter="url(#xm-tile-shadow)">
    <path d="M 512.00 80.00 C 754.78 80.00, 822.23 79.08, 883.57 140.43 C 944.92 201.77, 944.00 269.22, 944.00 512.00 C 944.00 754.78, 944.92 822.23, 883.57 883.57 C 822.23 944.92, 754.78 944.00, 512.00 944.00 C 269.22 944.00, 201.77 944.92, 140.43 883.57 C 79.08 822.23, 80.00 754.78, 80.00 512.00 C 80.00 269.22, 79.08 201.77, 140.43 140.43 C 201.77 79.08, 269.22 80.00, 512.00 80.00 Z" fill="url(#xm-bg-base)"/>
  </g>

  <!-- Layer 2: Internal Atmospheric Caustics & Fresnel Liquid Glass Edge -->
  <g clip-path="url(#xm-squircle-clip)">
    <rect x="80" y="80" width="864" height="864" fill="url(#xm-caustic-top)"/>
    <rect x="80" y="80" width="864" height="864" fill="url(#xm-caustic-bottom)"/>
    <rect x="80" y="80" width="864" height="864" fill="url(#xm-glass-sheen)"/>
    <rect x="80" y="720" width="864" height="224" fill="url(#xm-bottom-bounce)"/>

    <!-- Inner Fresnel Luminous Rim + Outer Crisp Definition -->
    <path d="M 512.00 86.00 C 751.41 86.00, 817.92 85.10, 878.41 145.59 C 938.90 206.08, 938.00 272.59, 938.00 512.00 C 938.00 751.41, 938.90 817.92, 878.41 878.41 C 817.92 938.90, 751.41 938.00, 512.00 938.00 C 272.59 938.00, 206.08 938.90, 145.59 878.41 C 85.10 817.92, 86.00 751.41, 86.00 512.00 C 86.00 272.59, 85.10 206.08, 145.59 145.59 C 206.08 85.10, 272.59 86.00, 512.00 86.00 Z" stroke="url(#xm-rim-bevel)" stroke-width="6.5"/>
    <path d="M 512.00 80.00 C 754.78 80.00, 822.23 79.08, 883.57 140.43 C 944.92 201.77, 944.00 269.22, 944.00 512.00 C 944.00 754.78, 944.92 822.23, 883.57 883.57 C 822.23 944.92, 754.78 944.00, 512.00 944.00 C 269.22 944.00, 201.77 944.92, 140.43 883.57 C 79.08 822.23, 80.00 754.78, 80.00 512.00 C 80.00 269.22, 79.08 201.77, 140.43 140.43 C 201.77 79.08, 269.22 80.00, 512.00 80.00 Z" stroke="#001842" stroke-opacity="0.26" stroke-width="4"/>
  </g>

  <!-- Layer 3: Subtle Stacked Frosted-Glass Memo Sheet (3D Depth Cue) -->
  <rect x="296" y="198" width="432" height="128" rx="52" fill="url(#xm-back-sheet)" stroke="#FFFFFF" stroke-opacity="0.50" stroke-width="2.5"/>

  <!-- Layer 4: Primary Frosted Liquid Glass Memo Card with Folded Corner -->
  <g filter="url(#xm-card-shadow)">
    <path d="M 332 238 H 630 L 768 376 V 714 C 768 756 734 790 692 790 H 332 C 290 790 256 756 256 714 V 314 C 256 272 290 238 332 238 Z" fill="url(#xm-card-fill)"/>
    <path d="M 332 240 H 629 L 766 377 V 714 C 766 754.9 732.9 788 692 788 H 332 C 291.1 788 258 754.9 258 714 V 314 C 258 273.1 291.1 240 332 240 Z" stroke="url(#xm-card-rim)" stroke-width="4"/>
  </g>

  <!-- Layer 5: Sculpted Glass Corner Fold -->
  <g filter="url(#xm-fold-shadow)">
    <path d="M 630 238 V 332 C 630 356.3 649.7 376 674 376 H 768 Z" fill="url(#xm-fold-flap)"/>
    <path d="M 632 242.8 V 332 C 632 355.2 650.8 374 674 374 H 763.2 Z" stroke="#FFFFFF" stroke-opacity="0.76" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Layer 6: Precision Interlocking Liquid Glass "X" Emblem (Optically Centered) -->
  <g>
    <!-- Back Diagonal Stroke (Top-Right to Bottom-Left) -->
    <path d="M 630 426 L 394 662" stroke="url(#xm-x-back)" stroke-width="86" stroke-linecap="round"/>

    <!-- Front Diagonal Stroke (Top-Left to Bottom-Right) with Realistic Overlap Shadow -->
    <g filter="url(#xm-x-cross-shadow)">
      <path d="M 394 426 L 630 662" stroke="url(#xm-x-front)" stroke-width="86" stroke-linecap="round"/>
    </g>

    <!-- Delicate Liquid Glass Specular Ridge on Front Stroke -->
    <path d="M 402 416 L 626 640" stroke="url(#xm-x-sheen)" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
